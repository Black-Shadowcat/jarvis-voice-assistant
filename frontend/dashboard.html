<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Control Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230a0e27' stroke='%2300aaff' stroke-width='2'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%2300aaff' font-size='10' font-family='monospace'>J</text></svg>">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#0a0e27;
    color:#e0e0e0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    height:100vh;
    overflow:hidden;
}

/* ── Layout ── */
.dashboard {
    display:grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:16px;
    padding:20px;
    height:100vh;
}

/* ── Panels ── */
.panel {
    background:rgba(13,27,42,0.6);
    border:1px solid rgba(42,158,226,0.15);
    border-radius:10px;
    padding:18px;
    display:flex;
    flex-direction:column;
    backdrop-filter:blur(6px);
    overflow:hidden;
}

.panel-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(42,158,226,0.1);
}

.panel-title {
    font-size:0.8rem;
    letter-spacing:.08em;
    color:#2a9ee2;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
}

.panel-action {
    font-size:0.7rem;
    opacity:0.5;
    cursor:pointer;
    transition:opacity 0.2s;
}
.panel-action:hover { opacity:1; }

/* ── Panel Content ── */
.panel-content {
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.panel-content::-webkit-scrollbar { width:3px; }
.panel-content::-webkit-scrollbar-track { background:transparent; }
.panel-content::-webkit-scrollbar-thumb { background:rgba(42,158,226,0.3); border-radius:2px; }

/* ── List Items (Apps / Mail / Tasks) ── */
.list-item {
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:6px;
    background:rgba(42,158,226,0.04);
    border:1px solid rgba(42,158,226,0.08);
    border-left:3px solid transparent;
    cursor:pointer;
    transition:all 0.2s ease;
}
.list-item:hover {
    background:rgba(42,158,226,0.12);
    border-left-color:#2a9ee2;
    transform:translateX(4px);
}

.list-icon {
    width:18px;
    text-align:center;
    color:#2a9ee2;
    opacity:0.7;
    font-size:0.9rem;
    flex-shrink:0;
}

.list-title { font-size:0.85rem; font-weight:500; }
.list-sub { font-size:0.75rem; color:#888; margin-top:2px; }
.list-sender { font-size:0.75rem; font-weight:600; color:#4cbf7e; text-transform:uppercase; letter-spacing:.04em; }

/* Task checkbox */
.task-cb { flex-shrink:0; accent-color:#4cbf7e; cursor:pointer; }
.task-cb.obsidian { accent-color:#a78bfa; }
.task-source { font-size:0.7rem; color:#4cbf7e; text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
.task-source.obsidian { color:#a78bfa; }

/* Badge */
.badge {
    background:#4cbf7e;
    color:#0a0e27;
    padding:2px 7px;
    border-radius:10px;
    font-size:0.65rem;
    font-weight:700;
}

/* Placeholder */
.placeholder {
    color:#555;
    text-align:center;
    padding:24px 20px;
    font-size:0.85rem;
}

/* ── Aktivierungs-Overlay ── */

/* ── Outline Icons ── */
.icon {
    width:14px;
    height:14px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex-shrink:0;
    vertical-align:middle;
}
.icon-sm { width:12px; height:12px; }
.icon-send { width:16px; height:16px; stroke-width:1.8; }

/* ── HUD ── */
#hud {
    width:240px;
    margin:0 auto 10px;
    cursor:pointer;
    filter:drop-shadow(0 0 8px rgba(0,170,255,0.2));
    display:block;
}

.rotate-slow {
    transform-origin:250px 250px;
    animation:spin 20s linear infinite;
}
.rotate-fast {
    transform-origin:250px 250px;
    animation:spin 6s linear infinite reverse;
}
@keyframes spin {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
}

.dot { animation:blink 2s infinite alternate; }
@keyframes blink { from { opacity:0.2; } to { opacity:1; } }

#main-ring {
    transition:stroke 0.3s, opacity 0.3s;
    stroke:#d4af37;
    opacity:0.6;
    transform-origin:250px 250px;
}

/* ── Chat ── */
#chat-history {
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:0.82rem;
    min-height:0;
}
#chat-history::-webkit-scrollbar { width:3px; }
#chat-history::-webkit-scrollbar-thumb { background:rgba(42,158,226,0.3); border-radius:2px; }

.msg {
    padding:7px 10px;
    border-radius:6px;
    border-left:3px solid;
    line-height:1.4;
    word-break:break-word;
}
.msg.jarvis {
    background:rgba(42,158,226,0.08);
    border-color:#2a9ee2;
}
.msg.user {
    background:rgba(76,191,126,0.08);
    border-color:#4cbf7e;
}
.msg strong { font-size:0.75rem; text-transform:uppercase; letter-spacing:.05em; }


/* ── Status text ── */
#status-text {
    font-size:0.75rem;
    color:#555;
    text-align:center;
    margin-bottom:6px;
    min-height:1em;
}
</style>
</head>

<script>
// ── State ──
let dashboardWs = null;
let audioQueue   = [];
let isPlaying    = false;
let isListening  = false;
let audioEndTime = 0;
let isMuted      = false;
let recognition  = null;
let audioContext = null;
let analyser     = null;
let animationId  = null;
let currentAudio = null; // verhindert Garbage Collection während Wiedergabe


const SPEECH_CORRECTIONS = {
    'ob sie dir': 'Obsidian',
    'ob si dir':  'Obsidian',
    'ob sie di':  'Obsidian',
    'obsidian':   'Obsidian',
};

function correctTranscript(text) {
    let t = text;
    for (const [w, r] of Object.entries(SPEECH_CORRECTIONS))
        t = t.replace(new RegExp(w, 'gi'), r);
    return t;
}

// ── AudioContext (einmal erstellen, nie doppelt) ──
function getAudioContext() {
    if (!audioContext)
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}

// ── Ring-Zustand ──
function setOrbState(state) {
    const ring = document.getElementById('main-ring');
    const status = document.getElementById('status-text');
    if (!ring) return;

    const colors = {
        idle:      { stroke:'#d4af37', opacity:'0.6' },
        listening: { stroke:'#00aaff', opacity:'1'   },
        speaking:  { stroke:'#00ff00', opacity:'0.8' },
        thinking:  { stroke:'#ff9500', opacity:'0.7' },
    };
    const labels = {
        idle:      'Warte auf Eingabe…',
        listening: '● Hört zu…',
        speaking:  '◉ Spricht…',
        thinking:  '◌ Denkt…',
    };

    const c = colors[state] || colors.idle;
    ring.style.stroke   = c.stroke;
    ring.style.opacity  = c.opacity;
    if (status) status.textContent = labels[state] || '';

    if (state === 'listening' || state === 'speaking') startAudioAnalysis(state);
    else stopAudioAnalysis();
}

// ── Ring-Animation ──
function startAudioAnalysis(state) {
    stopAudioAnalysis();
    const ring = document.getElementById('main-ring');
    if (!ring) return;

    if (state === 'speaking') {
        const loop = () => {
            animationId = requestAnimationFrame(loop);
            ring.style.transform = `rotate(-90deg) scale(${1 + Math.sin(Date.now()/150)*0.1})`;
        };
        loop();
        return;
    }

    if (!navigator.mediaDevices?.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        if (!analyser) {
            const ctx = getAudioContext();
            const src = ctx.createMediaStreamSource(stream);
            analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            src.connect(analyser);
        }
        const data = new Uint8Array(analyser.frequencyBinCount);
        const loop = () => {
            animationId = requestAnimationFrame(loop);
            analyser.getByteFrequencyData(data);
            const vol = data.reduce((a, b) => a + b) / data.length;
            ring.style.transform = `rotate(-90deg) scale(${1 + Math.sin(Date.now()/250)*0.06 + vol/500})`;
        };
        loop();
    }).catch(() => {});
}

function stopAudioAnalysis() {
    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    const ring = document.getElementById('main-ring');
    if (ring) ring.style.transform = 'rotate(-90deg) scale(1)';
}

// ── TTS Playback — new Audio(), identisch mit Produktivsystem ──
function queueAudio(b64) {
    audioQueue.push(b64);
    if (!isPlaying) playNext();
}

function playNext() {
    if (audioQueue.length === 0) {
        isPlaying = false;
        audioEndTime = Date.now();
        setOrbState('idle');
        setTimeout(startListening, 1200);
        return;
    }
    isPlaying = true;
    setOrbState('speaking');
    if (isListening) { recognition.stop(); isListening = false; }

    const b64 = audioQueue.shift();
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; playNext(); };
    currentAudio.onerror = () => { URL.revokeObjectURL(url); currentAudio = null; playNext(); };
    currentAudio.play().catch(() => {
        // Chrome hat blockiert — Audio zurück in Queue, auf Klick warten
        audioQueue.unshift(b64);
        URL.revokeObjectURL(url);
        currentAudio = null;
        isPlaying = false;
        setOrbState('idle');
        const st = document.getElementById('status-text');
        if (st) st.textContent = '▶ Klicke um Jarvis zu hören';
        document.addEventListener('click', () => playNext(), { once: true });
    });
}

// ── Spracherkennung ──
function initSpeechRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return console.warn('[Jarvis] Speech Recognition nicht unterstützt');

    recognition = new SR();
    recognition.lang = 'de-DE';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = e => {
        if (isPlaying || Date.now() - audioEndTime < 2000) return;
        const last = e.results[e.results.length - 1];
        if (!last.isFinal) return;
        const text = correctTranscript(last[0].transcript.trim());
        if (!text) return;
        addMsg('user', text);
        setOrbState('thinking');
        wsSend({ text });
    };
    recognition.onstart = () => { isListening = true; setOrbState('listening'); };
    recognition.onend   = () => {
        isListening = false;
        if (!isPlaying) setTimeout(startListening, 300);
        else setOrbState('idle');
    };
    recognition.onerror = e => {
        isListening = false;
        const retry = (e.error === 'no-speech' || e.error === 'aborted') ? 300 : 1000;
        if (!isPlaying) setTimeout(startListening, retry);
    };
}

function startListening() {
    if (isPlaying || isMuted || !recognition) return;
    try { recognition.start(); isListening = true; }
    catch(e) { isListening = false; }
}

// ── HUD klickbar ──
document.getElementById('hud').addEventListener('click', () => {
    if (isPlaying) return;
    if (!recognition) return;
    if (isListening) { recognition.stop(); isListening = false; setOrbState('idle'); }
    else startListening();
});

// ── WebSocket ──
function wsSend(obj) {
    if (dashboardWs?.readyState === WebSocket.OPEN)
        dashboardWs.send(JSON.stringify(obj));
}

function initWS() {
    if (dashboardWs?.readyState === WebSocket.OPEN) return;
    dashboardWs = new WebSocket(`ws://${location.host}/ws`);
    dashboardWs.onopen = () => {
        setOrbState('thinking');
        wsSend({ text: 'Jarvis activate' });
    };
    dashboardWs.onmessage = e => {
        const data = JSON.parse(e.data);
        if (data.type === 'response') {
            setOrbState('speaking');
            addMsg('jarvis', data.text);
            if (data.audio?.length > 0) queueAudio(data.audio);
            else setTimeout(() => { setOrbState('idle'); setTimeout(startListening, 1200); }, 1000);
        }
    };
    dashboardWs.onclose = () => setTimeout(initWS, 3000);
    dashboardWs.onerror = () => {};
}

// ── Chat ──
function addMsg(sender, text) {
    const h = document.getElementById('chat-history');
    // Platzhalter entfernen
    const ph = h.querySelector('.placeholder-msg');
    if (ph) ph.remove();

    const d = document.createElement('div');
    d.className = `msg ${sender}`;
    d.innerHTML = `<strong>${sender === 'user' ? 'Du' : 'Jarvis'}:</strong> ${text}`;
    h.appendChild(d);
    h.scrollTop = h.scrollHeight;
}


// ── App öffnen ──
function openApp(name) {
    fetch('/api/open_app', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ app: name })
    }).catch(() => {});
}

// ── Mails laden ──
async function loadMails() {
    const box   = document.getElementById('mail-container');
    const badge = document.getElementById('mail-count');
    try {
        const r = await fetch('/api/get_mails_unread');
        if (!r.ok) throw new Error();
        const { mails = [] } = await r.json();
        badge.textContent = mails.length;
        if (!mails.length) {
            box.innerHTML = '<div class="placeholder">Keine ungelesenen Mails</div>';
            return;
        }
        box.innerHTML = mails.map(m => {
            const sender = m.sender.split(' <')[0];
            return `<div class="list-item" onclick="openApp('Mail')">
                <div class="list-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></div>
                <div>
                    <div class="list-sender">${sender}</div>
                    <div class="list-sub">${m.subject}</div>
                </div>
            </div>`;
        }).join('');
    } catch {
        box.innerHTML = '<div class="placeholder">Fehler beim Laden</div>';
    }
}

// ── Aufgaben laden ──
async function loadTasks() {
    const box   = document.getElementById('task-container');
    const badge = document.getElementById('task-count');
    try {
        const [tr, or] = await Promise.all([
            fetch('/api/get_tasks'),
            fetch('/api/get_obsidian_notes'),
        ]);
        const { tasks = [] }        = tr.ok ? await tr.json() : {};
        const { notes: obsidian = [] } = or.ok ? await or.json() : {};

        const total = tasks.length + obsidian.length;
        badge.textContent = total;

        if (!total) {
            box.innerHTML = '<div class="placeholder">Alles erledigt!</div>';
            return;
        }

        const tasksHtml = tasks.map(t => `
            <div class="list-item">
                <input type="checkbox" class="task-cb" onchange="completeTask('${btoa(t.title)}','${t.title}',this.checked)">
                <div>
                    <div class="list-title">${t.title}</div>
                    <div class="task-source">Reminder</div>
                </div>
            </div>`).join('');

        const obsidianHtml = obsidian.map(n => `
            <div class="list-item">
                <input type="checkbox" class="task-cb obsidian" onchange="completeNote('${btoa(n.id)}','${n.id}',this.checked)">
                <div>
                    <div class="list-title">${n.title.substring(0,55)}${n.title.length>55?'…':''}</div>
                    <div class="task-source obsidian">Obsidian</div>
                </div>
            </div>`).join('');

        box.innerHTML = tasksHtml + obsidianHtml;
    } catch {
        box.innerHTML = '<div class="placeholder">Fehler beim Laden</div>';
    }
}

async function completeTask(safeId, title, checked) {
    if (!checked) return;
    await fetch('/api/complete_task', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: safeId, title }) }).catch(() => {});
    setTimeout(loadTasks, 500);
}

async function completeNote(safeId, id, checked) {
    if (!checked) return;
    await fetch('/api/complete_note', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) }).catch(() => {});
    setTimeout(loadTasks, 500);
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
    setOrbState('idle');
    initSpeechRecognition();
    initWS();
    loadMails();
    loadTasks();
    setInterval(() => { loadMails(); loadTasks(); }, 60000);

    fetch('/api/version').then(r => r.json()).then(v => {
        document.getElementById('app-version').textContent = `v${v.version}`;
    }).catch(() => {});
});
</script>
